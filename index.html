<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>midi-learner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>midi-learner</h1>
  </header>

  <main>
    <section id="connect">
      <button id="request-midi">Enable Web MIDI</button>
      <label>Output device:
        <select id="midi-outputs"></select>
      </label>
      <label>Input device (optional):
        <select id="midi-inputs"></select>
      </label>
    </section>

    <section id="file-section">
      <label class="file-label">Import MIDI file
        <input id="midi-file" type="file" accept=".mid,.midi">
      </label>
      <div id="file-info">No file loaded</div>
    </section>

    <section id="controls">
      <div class="transport">
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <label>Seek: <input id="seek" type="range" min="0" max="100" value="0"></label>
        <span id="time">0.00 / 0.00 s</span>
      </div>

      <div id="channels">
        <strong>Channels:</strong>
        <div id="channel-list"></div>
      </div>
    </section>

    <section id="modes">
      <button id="mode-play" class="mode active">Play Mode</button>
      <button id="mode-learn" class="mode">Learning Mode</button>
      <div id="mode-content">
        <div id="play-mode">Use the transport controls to play MIDI to the selected output device.</div>
        <div id="learn-mode" class="hidden">
          <div id="learn-config">
            <h3>Learning Mode Configuration</h3>
            <div class="config-row">
              <label>
                <input type="checkbox" id="learn-light-left"> Light Left Hand
              </label>
              <label>Left Navigation Channel: 
                <input type="number" id="learn-nav-left" min="1" max="16" value="1" style="width:50px">
              </label>
              <label>Bind to Song Channel:
                <select id="learn-bind-left"></select>
              </label>
            </div>
            <div class="config-row">
              <label>
                <input type="checkbox" id="learn-light-right"> Light Right Hand
              </label>
              <label>Right Navigation Channel: 
                <input type="number" id="learn-nav-right" min="1" max="16" value="2" style="width:50px">
              </label>
              <label>Bind to Song Channel:
                <select id="learn-bind-right"></select>
              </label>
            </div>
            <div class="config-row">
              <label>Level:
                <select id="learn-level">
                  <option value="follow">Follow</option>
                  <option value="remember">Remember (Placeholder)</option>
                </select>
              </label>
              <button id="learn-debug">🐛 Light Random Key (Debug)</button>
            </div>
          </div>
          <div id="learn-feedback">
            <div class="transport">
              <button id="learn-play">Play</button>
              <button id="learn-pause">Pause</button>
            </div>
            <div id="learn-status">Ready</div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <small>Works in Chromium/Chrome with Web MIDI enabled. Serve via HTTP for best results.</small>
    </footer>
  </main>

  <!-- MidiPlayerJS is imported by app.js as an ES module -->
  <script src="app.js" type="module"></script>
</body>
</html>
